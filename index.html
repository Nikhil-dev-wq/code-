<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coder Chat</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      font-size: 1.2em;
      border-bottom: 1px solid #333;
    }
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #222;
      padding: 8px 12px;
      border-radius: 10px;
      width: fit-content;
      max-width: 70%;
      word-wrap: break-word;
    }
    .self {
      background: #2563eb;
      align-self: flex-end;
    }
    footer {
      display: flex;
      padding: 10px;
      background: #222;
      border-top: 1px solid #333;
    }
    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #333;
      color: #fff;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      margin-left: 8px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
    }
    button:hover { background: #1d4ed8; }
    #toCodeBtn {
      background: #22c55e;
      margin-left: 0;
    }
    #toCodeBtn:hover { background: #16a34a; }
  </style>
</head>
<body>
  <header>
    <span>💬 Coder Chat</span>
    <button id="toCodeBtn">
      <i data-feather="code" style="margin-right: 6px;"></i> Go to Code Page
    </button>
  </header>

  <div id="chatBox"></div>
  <footer>
    <input id="msgInput" placeholder="Type a message...">
    <button id="sendBtn"><i data-feather="send"></i></button>
  </footer>

  <script>
    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
      authDomain: "social-516f8.firebaseapp.com",
      databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
      projectId: "social-516f8",
      storageBucket: "social-516f8.appspot.com",
      messagingSenderId: "190734911459",
      appId: "1:190734911459:web:ef79ce73f7dbdd617e50a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const toCodeBtn = document.getElementById("toCodeBtn");
    const username = "Coder"; // Default name

    // Go to Code Page
    toCodeBtn.onclick = () => {
      window.location.href = "code.html"; // Change to your actual code page filename
    };

    // Send message
    sendBtn.onclick = sendMessage;
    msgInput.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      const msgData = {
        name: username,
        text,
        time: Date.now()
      };
      db.ref("chat").push(msgData);
      msgInput.value = "";
    }

    // Receive messages
    db.ref("chat").on("child_added", snapshot => {
      const msg = snapshot.val();
      const div = document.createElement("div");
      div.classList.add("msg");
      if (msg.name === username) div.classList.add("self");
      div.innerHTML = `<strong>${msg.name}:</strong> ${msg.text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    feather.replace();
  </script>
</body>
</html>
