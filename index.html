<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Share Chat</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0e1117;
      color: white;
      margin: 0;
      padding: 0;
    }
    #chat-box {
      max-width: 700px;
      margin: 20px auto;
      background: #161b22;
      border-radius: 10px;
      padding: 10px;
      height: 70vh;
      overflow-y: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #msg-input {
      width: calc(100% - 100px);
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-right: 5px;
      background: #21262d;
      color: white;
    }
    #send-btn {
      padding: 10px 15px;
      background: #238636;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
    #typing {
      font-size: 14px;
      color: #aaa;
      padding: 5px;
    }
    #user-info {
      text-align: center;
      padding: 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .message {
      margin: 8px 0;
      padding: 6px 10px;
      border-radius: 5px;
    }
    .me {
      background: #238636;
      align-self: flex-end;
    }
    .other {
      background: #30363d;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <div id="user-info">Loading...</div>
  <div id="chat-box"></div>
  <div style="max-width:700px;margin:10px auto;display:flex;">
    <input id="msg-input" placeholder="Type message..." />
    <button id="send-btn">Send</button>
  </div>
  <div id="typing"></div>

  <script>
    // --- Firebase Config ---
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_KEY",
      authDomain: "YOUR_FIREBASE_DOMAIN",
      databaseURL: "YOUR_FIREBASE_DB_URL",
      projectId: "YOUR_FIREBASE_PROJECT",
      storageBucket: "YOUR_FIREBASE_BUCKET",
      messagingSenderId: "YOUR_FIREBASE_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Username setup ---
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
    }

    let username = getCookie("username") || localStorage.getItem("username");

    while (!username || username.trim() === "" || username.trim().toLowerCase() === "coder") {
      username = prompt("Enter your name (e.g., Sakshi, Nikhil):")?.trim();
    }

    document.cookie = `username=${username}; path=/; max-age=${60 * 60 * 24 * 30}`;
    localStorage.setItem("username", username);

    const chatBox = document.getElementById("chat-box");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const typingIndicator = document.getElementById("typing");
    const userInfo = document.getElementById("user-info");

    // --- Online Users ---
    const connectedRef = firebase.database().ref(".info/connected");
    const userRef = db.ref("online/" + username);

    connectedRef.on("value", (snap) => {
      if (snap.val() === true) {
        userRef.set(true);
        userRef.onDisconnect().remove();
      }
    });

    db.ref("online").on("value", (snapshot) => {
      const users = snapshot.val() || {};
      const onlineCount = Object.keys(users).length;
      userInfo.textContent = `🟢 ${username} | Online: ${onlineCount}`;
    });

    // --- Send Message ---
    sendBtn.onclick = sendMessage;
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const msg = msgInput.value.trim();
      if (!msg) return;
      db.ref("messages").push({
        user: username,
        text: msg,
        time: Date.now()
      });
      msgInput.value = "";
    }

    // --- Receive Messages ---
    db.ref("messages").on("child_added", (snapshot) => {
      const msg = snapshot.val();
      const div = document.createElement("div");
      div.classList.add("message", msg.user === username ? "me" : "other");
      div.textContent = `${msg.user}: ${msg.text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // --- Typing Indicator ---
    let typingTimeout;
    msgInput.addEventListener("input", () => {
      db.ref("typing/" + username).set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => db.ref("typing/" + username).remove(), 1500);
    });

    db.ref("typing").on("value", (snapshot) => {
      const typers = snapshot.val() || {};
      const others = Object.keys(typers).filter((n) => n !== username);
      typingIndicator.textContent = others.length ? `${others.join(", ")} typing...` : "";
    });
  </script>
</body>
</html>
