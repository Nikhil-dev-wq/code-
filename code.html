<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Share Web Editor</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>

  <!-- Monaco -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs/loader.js"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    body { background:#111; color:#fff; margin:0; font-family:sans-serif; }
    header {
      background:#222; display:flex; justify-content:space-between; align-items:center;
      padding:10px 15px; border-bottom:1px solid #333; font-size:1.1em;
    }
    .tab-bar {
      display:flex; background:#1a1a1a; border-bottom:1px solid #333;
    }
    .tab {
      flex:1; text-align:center; padding:10px; cursor:pointer; transition:0.2s;
    }
    .tab.active { background:#333; }
    #editor { height:80vh; border:1px solid #333; }
    .controls { padding:10px; display:flex; gap:10px; }
    button {
      background:#333; color:#fff; border:none; border-radius:8px; padding:10px 15px;
      cursor:pointer; transition:0.2s; display:flex; align-items:center; gap:5px;
    }
    button:hover { background:#444; }
  </style>
</head>
<body>
  <header>
    <span>🌐 True Live Share Web Editor</span>
    <button id="chatBtn"><i data-feather="message-square"></i> Go to Chat</button>
  </header>

  <!-- Tabs -->
  <div class="tab-bar">
    <div class="tab active" data-lang="html">HTML</div>
    <div class="tab" data-lang="css">CSS</div>
    <div class="tab" data-lang="js">JS</div>
  </div>

  <div id="editor"></div>

  <div class="controls">
    <button id="runBtn"><i data-feather="play"></i> Run Fullscreen</button>
    <button id="toggleBtn"><i data-feather="eye"></i> View Only</button>
  </div>

  <script>
    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
      authDomain: "social-516f8.firebaseapp.com",
      databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
      projectId: "social-516f8",
      storageBucket: "social-516f8.appspot.com",
      messagingSenderId: "190734911459",
      appId: "1:190734911459:web:ef79ce73f7dbdd617e50a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const codeRef = db.ref("liveWebCode");

    let editor, updating = false, viewOnly = false;
    let currentTab = "html";
    const codeData = {
      html: "<h1>Hello World</h1>",
      css: "body { background:#eef; }",
      js: "console.log('Hello from JS');"
    };

    // --- Monaco Setup ---
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs' } });
    require(["vs/editor/editor.main"], function() {
      editor = monaco.editor.create(document.getElementById("editor"), {
        value: codeData[currentTab],
        language: currentTab,
        theme: "vs-dark",
        automaticLayout: true
      });

      // Firebase Sync
      editor.onDidChangeModelContent(() => {
        if (viewOnly || updating) return;
        codeData[currentTab] = editor.getValue();
        codeRef.set(codeData);
      });

      codeRef.on("value", snap => {
        const val = snap.val();
        if (!val) return;
        updating = true;
        Object.assign(codeData, val);
        editor.setValue(codeData[currentTab]);
        updating = false;
      });
    });

    // --- Tab Switching ---
    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        if (tab.classList.contains("active")) return;
        document.querySelector(".tab.active").classList.remove("active");
        tab.classList.add("active");
        codeData[currentTab] = editor.getValue();
        currentTab = tab.dataset.lang;
        editor.setValue(codeData[currentTab]);
        monaco.editor.setModelLanguage(editor.getModel(), currentTab === "js" ? "javascript" : currentTab);
      };
    });

    // --- Run Code in Fullscreen with Nav Bar ---
    document.getElementById("runBtn").onclick = () => {
      codeData[currentTab] = editor.getValue();
      const combined = `
        <html>
          <head>
            <style>
              body { margin:0; font-family:sans-serif; }
              nav {
                background:#222; color:#fff; display:flex; justify-content:space-between;
                align-items:center; padding:10px 20px; border-bottom:2px solid #444;
              }
              button {
                background:#333; color:#fff; border:none; border-radius:6px; padding:8px 12px;
                cursor:pointer; transition:0.2s;
              }
              button:hover { background:#444; }
              ${codeData.css}
            </style>
          </head>
          <body>
            <nav>
              <span>🌍 Preview Page</span>
              <button onclick="window.close()">← Back to Editor</button>
            </nav>
            <main style="padding:10px;">
              ${codeData.html}
            </main>
            <script>${codeData.js}<\/script>
          </body>
        </html>
      `;
      const win = window.open("", "_blank");
      win.document.open();
      win.document.write(combined);
      win.document.close();
    };

    // --- Toggle Edit/View ---
    const toggleBtn = document.getElementById("toggleBtn");
    toggleBtn.addEventListener("click", () => {
      viewOnly = !viewOnly;
      editor.updateOptions({ readOnly: viewOnly });
      toggleBtn.innerHTML = viewOnly
        ? `<i data-feather="edit-3"></i> Edit Mode`
        : `<i data-feather="eye"></i> View Only`;
      feather.replace();
    });

    // --- Go to Chat ---
    document.getElementById("chatBtn").onclick = () => window.location.href = "index.html";

    feather.replace();
  </script>
</body>
</html>
