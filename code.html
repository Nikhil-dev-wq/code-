<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Share Editor with Terminal</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>

  <!-- Monaco -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs/loader.js"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    body { background:#111; color:#fff; margin:0; font-family:sans-serif; }
    header {
      background:#222; display:flex; justify-content:space-between; align-items:center;
      padding:10px 15px; border-bottom:1px solid #333;
    }
    #editor { height:60vh; border:1px solid #333; }
    .controls { padding:10px; display:flex; gap:10px; }
    button {
      background:#333; color:#fff; border:none; border-radius:8px;
      padding:10px 15px; cursor:pointer; display:flex; align-items:center; gap:5px;
    }
    button:hover { background:#444; }
    #terminal {
      background:#000; color:#0f0; font-family:monospace;
      height:25vh; overflow-y:auto; padding:10px;
    }
    #terminal-input {
      width:100%; background:#111; border:none; color:#0f0;
      font-family:monospace; padding:8px; outline:none;
    }
  </style>
</head>
<body>
  <header>
    <span>Live Share Editor</span>
    <button id="chatBtn"><i data-feather="message-square"></i> Go to Chat</button>
  </header>

  <div id="editor"></div>

  <div class="controls">
    <button id="runBtn" disabled><i data-feather="play"></i> Run Code</button>
    <button id="toggleBtn"><i data-feather="eye"></i> View Only</button>
  </div>

  <div id="terminal"></div>
  <input id="terminal-input" placeholder="Type input() values or pip commands here..." disabled />

  <script type="module">
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.mjs";

    const term = document.getElementById("terminal");
    const inputBox = document.getElementById("terminal-input");
    const runBtn = document.getElementById("runBtn");
    let pyodide, waitingInput = null;

    async function initPyodide() {
      term.innerHTML = "Loading Python environment...\n";
      pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/" });
      term.innerHTML += "✅ Pyodide ready!\nInstalling numpy...\n";
      await pyodide.loadPackage("numpy");
      term.innerHTML += "✅ NumPy loaded!\nYou can now run Python code.\n";
      runBtn.disabled = false;
      inputBox.disabled = false;
    }

    await initPyodide();

    // Custom input() support
    async function jsInput(promptText) {
      term.innerHTML += promptText;
      inputBox.disabled = false;
      inputBox.focus();
      return new Promise((resolve) => (waitingInput = resolve));
    }

    inputBox.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && waitingInput) {
        const val = inputBox.value.trim();
        inputBox.value = "";
        term.innerHTML += val + "\n";
        inputBox.disabled = true;
        waitingInput(val);
        waitingInput = null;
      }
    });

    async function runPython(code) {
      term.innerHTML += "\n> Running...\n";
      try {
        pyodide.registerJsModule("js_input", { input: jsInput });

        if (code.trim().startsWith("pip install")) {
          const pkg = code.split(" ")[2];
          term.innerHTML += `Installing ${pkg}...\n`;
          await pyodide.runPythonAsync(`import micropip; await micropip.install('${pkg}')`);
          term.innerHTML += `✅ ${pkg} installed!\n`;
        } else {
          const result = await pyodide.runPythonAsync(`
import builtins, js_input
builtins.input = js_input.input
${code}
`);
          if (result !== undefined) term.innerHTML += result + "\n";
        }
      } catch (err) {
        term.innerHTML += `❌ Error: ${err}\n`;
      }
      term.scrollTop = term.scrollHeight;
    }

    window.runPython = runPython;
  </script>

  <script>
    // Firebase setup
    const firebaseConfig = {
      apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
      authDomain: "social-516f8.firebaseapp.com",
      databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
      projectId: "social-516f8",
      storageBucket: "social-516f8.appspot.com",
      messagingSenderId: "190734911459",
      appId: "1:190734911459:web:ef79ce73f7dbdd617e50a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const codeRef = db.ref("liveCode");

    let editor, updating = false, viewOnly = false;

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs' } });
    require(["vs/editor/editor.main"], function () {
      editor = monaco.editor.create(document.getElementById("editor"), {
        value: "# NumPy is ready!\nimport numpy as np\nprint(np.arange(5))\nname = input('Your name: ')\nprint('Hello', name)",
        language: "python",
        theme: "vs-dark",
        automaticLayout: true,
      });

      editor.onDidChangeModelContent(() => {
        if (viewOnly || updating) return;
        codeRef.set({ code: editor.getValue(), cursor: editor.getPosition() });
      });

      codeRef.on("value", snap => {
        const val = snap.val();
        if (!val) return;
        const local = editor.getValue();
        if (local !== val.code) {
          const pos = editor.getPosition();
          updating = true;
          editor.setValue(val.code);
          if (val.cursor && viewOnly) editor.setPosition(val.cursor);
          else editor.setPosition(pos);
          updating = false;
        }
      });
    });

    runBtn.onclick = async () => {
      const code = editor.getValue();
      await runPython(code);
    };

    document.getElementById("chatBtn").onclick = () => (window.location.href = "index.html");

    const toggleBtn = document.getElementById("toggleBtn");
    toggleBtn.addEventListener("click", () => {
      viewOnly = !viewOnly;
      editor.updateOptions({ readOnly: viewOnly });
      toggleBtn.innerHTML = viewOnly
        ? `<i data-feather="edit-3"></i> Edit Mode`
        : `<i data-feather="eye"></i> View Only`;
      feather.replace();
    });

    feather.replace();
  </script>
</body>
</html>
