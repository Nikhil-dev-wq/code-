<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Python Editor</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>

  <!-- Monaco -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs/loader.js"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

  <style>
    body { margin:0; background:#111; color:#fff; font-family:sans-serif; }
    header { background:#222; padding:10px; border-bottom:1px solid #333; }
    #editor { height:70vh; }
    #controls { padding:10px; }
    #output {
      background:#000; padding:10px; height:20vh;
      overflow:auto; border-top:1px solid #333;
      font-family:monospace;
    }
    button {
      background:#333; color:#fff; border:none;
      padding:8px 14px; border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<header>🐍 Live Python Editor + Runner</header>
<div id="editor"></div>

<div id="controls">
  <button onclick="runPython()">▶ Run</button>
</div>

<div id="output">Output will appear here...</div>

<script>
  // Firebase
  firebase.initializeApp({
    apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
    authDomain: "social-516f8.firebaseapp.com",
    databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
    projectId: "social-516f8"
  });

  const db = firebase.database();
  const codeRef = db.ref("livePythonCode");

  let editor, updating = false, pyodide;

  // Load Pyodide
  async function loadPyodideEnv() {
    pyodide = await loadPyodide();
  }
  loadPyodideEnv();

  require.config({
    paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs" }
  });

  require(["vs/editor/editor.main"], () => {
    editor = monaco.editor.create(document.getElementById("editor"), {
      value: "print('Hello Python')",
      language: "python",
      theme: "vs-dark",
      automaticLayout: true
    });

    editor.onDidChangeModelContent(() => {
      if (updating) return;
      codeRef.set(editor.getValue());
    });

    codeRef.on("value", snap => {
      if (!snap.exists()) return;
      updating = true;
      editor.setValue(snap.val());
      updating = false;
    });
  });

  async function runPython() {
    const output = document.getElementById("output");
    output.textContent = "";

    try {
      pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
      pyodide.runPython(editor.getValue());
      output.textContent = pyodide.runPython("sys.stdout.getvalue()");
    } catch (err) {
      output.textContent = err;
    }
  }
</script>

</body>
</html>
