<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Live Editor with Terminal</title>

  <!-- Pyodide -->
  <script type="module" src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.mjs"></script>

  <style>
    body {
      background: #0d0d0d; color: #fff;
      font-family: monospace; margin: 0;
    }
    header {
      background: #111; padding: 10px 15px;
      border-bottom: 1px solid #333;
      display: flex; justify-content: space-between; align-items: center;
    }
    #editor { height: 55vh; border: 1px solid #333; }
    #terminal {
      background: #000; color: #0f0;
      height: 35vh; overflow-y: auto; padding: 10px;
      font-family: monospace;
    }
    #terminal-input {
      width: 100%; border: none; outline: none;
      padding: 8px; font-family: monospace;
      color: #0f0; background: #111;
    }
    button {
      background: #222; color: #fff;
      border: none; padding: 8px 15px;
      border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <header>
    <span>💻 Python Live Editor</span>
    <button id="runBtn">▶ Run</button>
  </header>

  <textarea id="editor">
import numpy as np
print("NumPy loaded:", np.arange(5))
name = input("Enter your name: ")
print("Hello", name)
  </textarea>

  <div id="terminal"></div>
  <input id="terminal-input" placeholder="Type input() value here..." disabled />

  <script type="module">
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.mjs";

    const term = document.getElementById("terminal");
    const inputBox = document.getElementById("terminal-input");
    const runBtn = document.getElementById("runBtn");
    const editor = document.getElementById("editor");

    let pyodide, waitingInput = null;

    // Load Pyodide + NumPy
    async function init() {
      term.textContent = "Loading Python...\n";
      pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/" });
      term.textContent += "✅ Pyodide ready!\nInstalling NumPy...\n";
      await pyodide.loadPackage("numpy");
      term.textContent += "✅ NumPy loaded!\nReady to run code.\n";
      runBtn.disabled = false;
    }
    init();

    // Handle Python input()
    async function jsInput(promptText) {
      term.innerHTML += promptText;
      inputBox.disabled = false;
      inputBox.focus();
      return new Promise(resolve => waitingInput = resolve);
    }

    inputBox.addEventListener("keydown", e => {
      if (e.key === "Enter" && waitingInput) {
        const value = inputBox.value;
        inputBox.value = "";
        inputBox.disabled = true;
        term.innerHTML += value + "\n";
        waitingInput(value);
        waitingInput = null;
      }
    });

    async function runPython(code) {
      async function runPython(code) {
  term.innerHTML = "";
  try {
    pyodide.registerJsModule("js_input", { input: jsInput });
    const wrapped = `
import builtins, js_input
builtins.input = js_input.input
${code}
`;
    const result = await pyodide.runPythonAsync(wrapped);
    if (result !== undefined && result !== null) {
      term.innerHTML += result + "\n";
    }
  } catch (err) {
    term.innerHTML += `❌ Error: ${err}\n`;
  }
  term.scrollTop = term.scrollHeight;
}


    runBtn.onclick = () => runPython(editor.value);
  </script>
</body>
</html>
