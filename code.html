<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Share Editor</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>

  <!-- Monaco Editor -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs/loader.js"></script>

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Pyodide -->
  <script type="module">
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.mjs";

    window.pyodideReadyPromise = (async () => {
      const pyodide = await loadPyodide();
      console.log("✅ Pyodide loaded");
      return pyodide;
    })();
  </script>

  <style>
    body { background:#111; color:#fff; margin:0; font-family:sans-serif; }
    header {
      background:#222; display:flex; justify-content:space-between; align-items:center;
      padding:10px 15px; border-bottom:1px solid #333; font-size:1.1em;
    }
    #editor { height:60vh; border:1px solid #333; }
    #terminal {
      background:#000; color:#0f0; font-family:monospace;
      height:25vh; overflow-y:auto; padding:10px; border-top:1px solid #333;
    }
    #terminal-input {
      width:100%; background:#111; border:none; color:#0f0;
      font-family:monospace; padding:8px; outline:none;
    }
    .controls { padding:10px; display:flex; gap:10px; }
    button {
      background:#333; color:#fff; border:none; border-radius:8px; padding:10px 15px;
      cursor:pointer; transition:0.2s; display:flex; align-items:center; gap:5px;
    }
    button:hover { background:#444; }
  </style>
</head>
<body>
  <header>
    <span>Live Share Editor</span>
    <button id="chatBtn"><i data-feather="message-square"></i> Go to Chat</button>
  </header>

  <div id="editor"></div>

  <div class="controls">
    <button id="runBtn"><i data-feather="play"></i> Run Code</button>
    <button id="toggleBtn"><i data-feather="eye"></i> View Only</button>
  </div>

  <div id="terminal"></div>
  <input id="terminal-input" placeholder="Type here (input/pip commands supported)...">

  <script>
    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
      authDomain: "social-516f8.firebaseapp.com",
      databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
      projectId: "social-516f8",
      storageBucket: "social-516f8.appspot.com",
      messagingSenderId: "190734911459",
      appId: "1:190734911459:web:ef79ce73f7dbdd617e50a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const codeRef = db.ref("liveCode");

    let editor, updating = false, viewOnly = false;

    // --- Monaco Setup ---
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs' } });
    require(["vs/editor/editor.main"], function() {
      editor = monaco.editor.create(document.getElementById("editor"), {
        value: "# Live Python Code\nprint('Hello Live Share!')",
        language: "python",
        theme: "vs-dark",
        automaticLayout: true
      });

      editor.onDidChangeModelContent(() => {
        if (viewOnly || updating) return;
        codeRef.set({
          code: editor.getValue(),
          cursor: editor.getPosition()
        });
      });

      codeRef.on("value", snap => {
        const val = snap.val();
        if (!val) return;
        const local = editor.getValue();
        if (local !== val.code) {
          const currentPos = editor.getPosition();
          updating = true;
          editor.setValue(val.code);
          if (!viewOnly && val.cursor) editor.setPosition(val.cursor);
          else editor.setPosition(currentPos);
          updating = false;
        }
      });
    });

    // --- Terminal & Pyodide ---
    const terminal = document.getElementById("terminal");
    const terminalInput = document.getElementById("terminal-input");
    const runBtn = document.getElementById("runBtn");

    async function runPython(code) {
      const pyodide = await window.pyodideReadyPromise;
      try {
        terminal.innerHTML += "\n> Running...\n";
        const result = await pyodide.runPythonAsync(code);
        terminal.innerHTML += result !== undefined ? result + "\n" : "";
      } catch (err) {
        terminal.innerHTML += `\nError: ${err}\n`;
      }
      terminal.scrollTop = terminal.scrollHeight;
    }

    runBtn.onclick = async () => {
      const code = editor.getValue();
      await runPython(code);
    };

    // --- Input Support ---
    terminalInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const input = terminalInput.value.trim();
        terminalInput.value = "";
        if (!input) return;
        terminal.innerHTML += "\n>>> " + input + "\n";
        const pyodide = await window.pyodideReadyPromise;

        if (input.startsWith("pip install ")) {
          const pkg = input.replace("pip install ", "").trim();
          terminal.innerHTML += `Installing ${pkg}...\n`;
          await pyodide.loadPackage(pkg);
          terminal.innerHTML += `✅ ${pkg} installed!\n`;
        } else {
          try {
            const result = await pyodide.runPythonAsync(input);
            if (result !== undefined) terminal.innerHTML += result + "\n";
          } catch (err) {
            terminal.innerHTML += `Error: ${err}\n`;
          }
        }
        terminal.scrollTop = terminal.scrollHeight;
      }
    });

    // --- Toggle Edit/View ---
    const toggleBtn = document.getElementById("toggleBtn");
    toggleBtn.addEventListener("click", () => {
      viewOnly = !viewOnly;
      editor.updateOptions({ readOnly: viewOnly });
      toggleBtn.innerHTML = viewOnly
        ? `<i data-feather="edit-3"></i> Edit Mode`
        : `<i data-feather="eye"></i> View Only`;
      feather.replace();
    });

    document.getElementById("chatBtn").onclick = () => {
      window.location.href = "index.html";
    };

    feather.replace();
  </script>
</body>
</html>
