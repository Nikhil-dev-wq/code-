<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Share Code Editor</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs/loader.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    body { background: #111; color: #fff; margin: 0; font-family: sans-serif; }
    header {
      background: #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      font-size: 1.2em;
      border-bottom: 1px solid #333;
    }
    #editor { height: 70vh; border: 1px solid #333; }
    .buttons { display: flex; gap: 10px; padding: 10px; }
    button {
      background: #444; color: white; border: none; padding: 10px 15px;
      border-radius: 8px; cursor: pointer; transition: 0.3s;
      display: flex; align-items: center;
    }
    button:hover { background: #666; }
    .active { background: #22c55e !important; }
    #chatBtn {
      background: #22c55e;
      margin-right: 10px;
    }
    #chatBtn:hover { background: #16a34a; }
    #output {
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 10px;
      border-top: 1px solid #333;
      height: 20vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <header>
    <span>💻 Live Share Code Editor</span>
    <button id="chatBtn"><i data-feather="message-square" style="margin-right:6px;"></i> Go to Chat</button>
  </header>

  <div id="editor"></div>

  <div class="buttons">
    <button id="runBtn"><i data-feather="play"></i> Run Code</button>
    <button id="liveShareBtn"><i data-feather="share-2"></i> Start Live Share</button>
  </div>

  <div id="output">Output will appear here...</div>

  <script type="module">
    // --- Firebase Setup ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
      authDomain: "social-516f8.firebaseapp.com",
      databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
      projectId: "social-516f8",
      storageBucket: "social-516f8.appspot.com",
      messagingSenderId: "190734911459",
      appId: "1:190734911459:web:ef79ce73f7dbdd617e50a8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const codeRef = ref(db, "liveCode");

    // --- Monaco Editor ---
    let editor, liveShareEnabled = false;

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs' }});
    require(["vs/editor/editor.main"], function() {
      editor = monaco.editor.create(document.getElementById("editor"), {
        value: "# Write Python code here\nprint('Hello from Live Share!')",
        language: "python",
        theme: "vs-dark",
        automaticLayout: true
      });

      // Listen for remote updates
      onValue(codeRef, (snapshot) => {
        const val = snapshot.val();
        if (val && !liveShareEnabled && editor.getValue() !== val.code) {
          editor.setValue(val.code);
        }
      });

      // When local user types
      editor.onDidChangeModelContent(() => {
        if (liveShareEnabled) {
          const code = editor.getValue();
          set(codeRef, { code });
        }
      });
    });

    // --- Live Share Toggle ---
    const btn = document.getElementById("liveShareBtn");
    btn.addEventListener("click", () => {
      liveShareEnabled = !liveShareEnabled;
      if (liveShareEnabled) {
        btn.classList.add("active");
        btn.innerHTML = `<i data-feather="share"></i> Stop Live Share`;
      } else {
        btn.classList.remove("active");
        btn.innerHTML = `<i data-feather="share-2"></i> Start Live Share`;
      }
      feather.replace();
    });

    // --- Run Code Button (Python using Skulpt) ---
    const runBtn = document.getElementById("runBtn");
    const output = document.getElementById("output");

    function outf(text) {
      output.innerHTML += text;
    }

    function builtinRead(x) {
      if (!Sk.builtinFiles || !Sk.builtinFiles["files"][x]) throw "File not found: " + x;
      return Sk.builtinFiles["files"][x];
    }

    function runCode() {
      output.innerHTML = "";
      const code = editor.getValue();
      Sk.configure({ output: outf, read: builtinRead });
      Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
        .catch((err) => { output.innerHTML = `<span style='color:red'>${err}</span>`; });
    }

    runBtn.addEventListener("click", runCode);

    // --- Go to Chat Page ---
    document.getElementById("chatBtn").addEventListener("click", () => {
      window.location.href = "index.html"; // Change to your chat page filename
    });

    feather.replace();
  </script>
</body>
</html>
