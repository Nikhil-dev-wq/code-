<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Python Terminal</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #editor {
      flex: 1;
      width: 100%;
      height: 40%;
      background: #111;
      color: white;
      font-family: monospace;
      padding: 10px;
      border: none;
      resize: none;
      outline: none;
    }
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      white-space: pre-wrap;
    }
    #terminal {
      border-top: 1px solid #333;
      background: #000;
      padding: 10px;
      display: flex;
      align-items: center;
    }
    #termInput {
      flex: 1;
      background: #000;
      color: #0f0;
      border: none;
      outline: none;
      font-family: monospace;
      font-size: 1em;
    }
    #runBtn {
      background: #0f0;
      border: none;
      color: #000;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
    }
    #runBtn:hover {
      background: #5f5;
    }
  </style>
</head>
<body>
  <textarea id="editor" placeholder="Write Python code here...">name = input("Enter your name: ")
age = input("Enter your age: ")
print("Name not", name)
print("Age not", age)</textarea>

  <button id="runBtn">Run</button>
  <div id="output">Ready.\n</div>

  <div id="terminal">
    <span style="color:#0f0;">$ </span>
    <input id="termInput" type="text" placeholder="Type input..." autocomplete="off" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

  <script>
    const editor = document.getElementById("editor");
    const output = document.getElementById("output");
    const runBtn = document.getElementById("runBtn");
    const termInput = document.getElementById("termInput");

    let inputResolve = null; // Holds the resolve function for awaiting inputs

    // Custom Skulpt input function
    function customInput(promptText) {
      output.innerHTML += promptText; // show prompt like Linux
      return new Promise((resolve) => {
        inputResolve = resolve;
        termInput.focus();
      });
    }

    // Handle user input
    termInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && inputResolve) {
        const val = termInput.value;
        termInput.value = "";
        output.innerHTML += val + "\n"; // print input line
        const resolveNow = inputResolve;
        inputResolve = null;
        resolveNow(val);
      }
    });

    // Run button logic
    runBtn.addEventListener("click", () => {
      output.innerHTML = "Running Python...\n";
      inputResolve = null;

      Sk.configure({
        output: (text) => (output.innerHTML += text),
        read: (x) => {
          if (!Sk.builtinFiles || !Sk.builtinFiles["files"][x])
            throw "File not found: '" + x + "'";
          return Sk.builtinFiles["files"][x];
        },
        inputfun: customInput,
        inputfunTakesPrompt: true,
      });

      Sk.misceval
        .asyncToPromise(() =>
          Sk.importMainWithBody("<stdin>", false, editor.value, true)
        )
        .catch((err) => {
          output.innerHTML += `\nError: ${err.toString()}\n`;
        });
    });
  </script>
</body>
</html>
