<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Share Editor</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>

  <!-- Monaco -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs/loader.js"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    body { background:#111; color:#fff; margin:0; font-family:sans-serif; }
    header {
      background:#222; display:flex; justify-content:space-between; align-items:center;
      padding:10px 15px; border-bottom:1px solid #333; font-size:1.1em;
    }
    #editor { height:70vh; border:1px solid #333; }
    .controls { padding:10px; display:flex; gap:10px; }
    button {
      background:#333; color:#fff; border:none; border-radius:8px; padding:10px 15px;
      cursor:pointer; transition:0.2s; display:flex; align-items:center; gap:5px;
    }
    button:hover { background:#444; }
    .active { background:#22c55e !important; }
    #output {
      background:#000; color:#0f0; font-family:monospace;
      height:20vh; overflow-y:auto; padding:10px; border-top:1px solid #333;
    }
  </style>
</head>
<body>
  <header>
    <span>Live Share Editor</span>
    <button id="chatBtn"><i data-feather="message-square"></i> Go to Chat</button>
  </header>

  <div id="editor"></div>

  <div class="controls">
    <button id="runBtn"><i data-feather="play"></i> Run Code</button>
    <button id="toggleBtn"><i data-feather="eye"></i> View Only</button>
  </div>

  <div id="output">Output will appear here...</div>

  <script>
    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
      authDomain: "social-516f8.firebaseapp.com",
      databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
      projectId: "social-516f8",
      storageBucket: "social-516f8.appspot.com",
      messagingSenderId: "190734911459",
      appId: "1:190734911459:web:ef79ce73f7dbdd617e50a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const codeRef = db.ref("liveCode");

    let editor, updating = false;
    let viewOnly = false;

    // --- Monaco Setup ---
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs' } });
    require(["vs/editor/editor.main"], function() {
      editor = monaco.editor.create(document.getElementById("editor"), {
        value: "# Real-time Python code sharing\nprint('Hello Live Share!')",
        language: "python",
        theme: "vs-dark",
        automaticLayout: true
      });

      // Update Firebase when typing
      editor.onDidChangeModelContent(() => {
        if (viewOnly || updating) return;
        codeRef.set({
          code: editor.getValue(),
          cursor: editor.getPosition()
        });
      });

      // Receive updates without resetting cursor
      codeRef.on("value", snap => {
        const val = snap.val();
        if (!val) return;

        const local = editor.getValue();
        if (local !== val.code) {
          const currentPos = editor.getPosition();
          updating = true;
          editor.setValue(val.code);
          // Keep cursor position for viewer
          if (viewOnly && val.cursor) editor.setPosition(val.cursor);
          else editor.setPosition(currentPos);
          updating = false;
        }
      });
    });

    // --- Run Python Code (via Skulpt) ---
    const output = document.getElementById("output");
    const runBtn = document.getElementById("runBtn");
    runBtn.addEventListener("click", () => {
      output.innerHtml = "";
      const code = editor.getValue();
  
      Sk.configure({
        output: text => output.innerHTML += text,
        read: name => {
          if (!Sk.builtinFiles || !Sk.builtinFiles["files"][name])
            throw "File not found: " + name;
          return Sk.builtinFiles["files"][name];
        }
      });
      Sk.misceval.asyncToPromise(() =>
        Sk.importMainWithBody("<stdin>", false, code, true)
      ).catch(err => output.innerHTML = `<span style="color:red">${err}</span>`);
    });

    // --- Toggle Edit/View ---
    const toggleBtn = document.getElementById("toggleBtn");
    toggleBtn.addEventListener("click", () => {
      viewOnly = !viewOnly;
      editor.updateOptions({ readOnly: viewOnly });
      toggleBtn.innerHTML = viewOnly
        ? `<i data-feather="edit-3"></i> Edit Mode`
        : `<i data-feather="eye"></i> View Only`;
      feather.replace();
    });

    // --- Go to Chat ---
    document.getElementById("chatBtn").onclick = () => {
      window.location.href = "index.html";
    };

    feather.replace();
  </script>

  <!-- Skulpt -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
</body>
</html>
