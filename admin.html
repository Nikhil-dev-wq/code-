<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Control Panel</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
    h2 { color: #22c55e; text-align: center; }
    .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .tab-btn {
      background: #222; color: #fff; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .tab-btn.active { background: #22c55e; color: #111; }
    .tab-content { display: none; }
    .active-tab { display: block; }

    input, textarea, button {
      width: 100%; margin: 10px 0; padding: 10px;
      border-radius: 8px; border: none; background: #222; color: #fff;
    }
    button { background: #22c55e; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    .task, .submission {
      background: #1b1b1b; padding: 15px; border-radius: 10px;
      margin-top: 10px; border-left: 4px solid #22c55e;
    }
    .btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .edit { background: #2563eb; }
    .delete { background: #ef4444; }
    .feedback-box { margin-top: 10px; }
    textarea.feedback { background: #333; height: 60px; }
    .rating select { background: #333; color: #fff; padding: 5px; border-radius: 6px; }
    pre {
      background: #000; padding: 10px; border-radius: 8px;
      overflow-x: auto; color: #ddd; font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>⚙ Admin Control Panel</h2>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('tasks')">📋 Tasks</button>
    <button class="tab-btn" onclick="showTab('submissions')">💻 Submissions</button>
  </div>

  <!-- Tasks Tab -->
  <div id="tasks" class="tab-content active-tab">
    <h3>➕ Add Task (Only One Allowed)</h3>
    <input id="title" placeholder="Task title" />
    <textarea id="desc" placeholder="Task description"></textarea>
    <button onclick="addTask()">Add Task</button>

    <h3>📋 Current Task</h3>
    <div id="taskList">Loading...</div>
  </div>

  <!-- Submissions Tab -->
  <div id="submissions" class="tab-content">
    <h3>💻 Student Submissions</h3>
    <div id="submissionList">Loading...</div>
  </div>

  <script>
    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyCQOhn1RMCnGbtYyJbl_KyHwWzftsn44tk",
      authDomain: "social-516f8.firebaseapp.com",
      databaseURL: "https://social-516f8-default-rtdb.firebaseio.com/",
      projectId: "social-516f8",
      storageBucket: "social-516f8.appspot.com",
      messagingSenderId: "190734911459",
      appId: "1:190734911459:web:ef79ce73f7dbdd617e50a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Tabs ---
    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(div => div.classList.remove('active-tab'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tab).classList.add('active-tab');
      event.target.classList.add('active');
    }

    // --- Add Task (Only one allowed) ---
    function addTask() {
      const title = document.getElementById("title").value.trim();
      const desc = document.getElementById("desc").value.trim();
      if (!title || !desc) return alert("⚠ Enter both title and description!");

      // Check if task already exists
      db.ref("tasks").once("value", snap => {
        if (snap.exists()) {
          alert("⚠ Only one task allowed! Delete the current task first.");
        } else {
          db.ref("tasks").push({ title, description: desc, time: Date.now() });
          alert("✅ Task added!");
          document.getElementById("title").value = "";
          document.getElementById("desc").value = "";
        }
      });
    }

    // --- Load Task ---
    const taskList = document.getElementById("taskList");
    db.ref("tasks").on("value", snap => {
      const data = snap.val();
      taskList.innerHTML = "";
      if (!data) return taskList.innerHTML = "<p>No active task.</p>";

      const [id, t] = Object.entries(data)[0];
      const div = document.createElement("div");
      div.className = "task";
      div.innerHTML = `
        <h4>${t.title}</h4>
        <p>${t.description}</p>
        <div class="btns">
          <button class="edit" onclick="editTask('${id}', '${t.title}', '${t.description}')">✏ Edit</button>
          <button class="delete" onclick="deleteTask('${id}')">🗑 Delete</button>
        </div>`;
      taskList.appendChild(div);
    });

    function editTask(id, oldTitle, oldDesc) {
      const newTitle = prompt("Edit title:", oldTitle);
      if (newTitle === null) return;
      const newDesc = prompt("Edit description:", oldDesc);
      if (newDesc === null) return;
      db.ref("tasks/" + id).update({ title: newTitle, description: newDesc });
      alert("✅ Task updated!");
    }

    function deleteTask(id) {
      if (confirm("Delete this task?")) {
        db.ref("tasks/" + id).remove();
        alert("🗑 Task deleted!");
      }
    }

    // --- Load Submissions ---
    const submissionList = document.getElementById("submissionList");
    db.ref("submissions").on("value", snap => {
      const data = snap.val();
      submissionList.innerHTML = "";
      if (!data) return submissionList.innerHTML = "<p>No submissions yet.</p>";

      const sorted = Object.entries(data).sort((a,b)=>b[1].time - a[1].time);
      sorted.forEach(([id, s]) => {
        const div = document.createElement("div");
        div.className = "submission";
        const date = new Date(s.time).toLocaleString();
        div.innerHTML = `
          <h4>📄 Submission (${date})</h4>
          <pre>${s.code || "(no code)"}</pre>
          <div class="feedback-box">
            <textarea class="feedback" id="feedback-${id}" placeholder="Feedback...">${s.feedback || ""}</textarea>
            <div class="rating">
              ⭐ Rating:
              <select id="rating-${id}">
                <option value="">--Select--</option>
                <option value="1">1 ⭐</option>
                <option value="2">2 ⭐⭐</option>
                <option value="3">3 ⭐⭐⭐</option>
                <option value="4">4 ⭐⭐⭐⭐</option>
                <option value="5">5 ⭐⭐⭐⭐⭐</option>
              </select>
            </div>
            <div class="btns">
              <button onclick="sendFeedback('${id}')">📩 Send Feedback</button>
              <button class="delete" onclick="deleteSubmission('${id}')">🗑 Delete</button>
            </div>
          </div>`;
        submissionList.appendChild(div);

        // Auto-delete task after student submits
        autoDeleteTask();
      });
    });

    // --- Feedback ---
    function sendFeedback(id) {
      const feedback = document.getElementById(`feedback-${id}`).value.trim();
      const rating = document.getElementById(`rating-${id}`).value;
      db.ref("submissions/" + id).update({ feedback, rating });
      alert("✅ Feedback saved!");
    }

    // --- Delete Submission ---
    function deleteSubmission(id) {
      if (confirm("Delete this submission?")) {
        db.ref("submissions/" + id).remove();
        alert("🗑 Submission deleted!");
      }
    }

    // --- Auto Delete Task on New Submission ---
    function autoDeleteTask() {
      db.ref("submissions").once("value", snap => {
        if (snap.exists()) {
          db.ref("tasks").remove(); // delete active task
        }
      });
    }
  </script>
</body>
</html>
